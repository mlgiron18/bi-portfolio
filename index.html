    /* ========================================
       DESIGN TOKENS (from ui-ux-pro-max)

    :root {
      /* Primitives */

      --gray-100: #F5F5F4;
      --gray-200: #E7E5E4;
      --gray-300: #D6D3D1;

      --gray-500: #78716C;
      --gray-600: #57534E;
      --gray-700: #44403C;
      --gray-800: #292524;
      --gray-900: #1C1917;

      --brand-50:  #FFF7ED;
      --brand-100: #FFEDD5;
      --brand-200: #FED7AA;
      --brand-300: #FDBA74;
      --brand-400: #FB923C;

      --color-background: var(--gray-50);
      --color-surface: #FFFFFF;
      --color-surface-alt: var(--gray-100);
      --color-foreground: var(--ink);
      --color-muted: var(--ink-muted);
      --color-border: var(--gray-200);
      --color-accent: var(--brand-500);
      --color-accent-soft: var(--brand-50);

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --space-8: 64px;
      --space-9: 96px;
      --space-10: 128px;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;

      /* Typography */
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-display: 'DM Serif Display', Georgia, serif;
